<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oxford 3000 - Limitless</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        #app { text-align: center; width: 100%; max-width: 400px; padding: 20px; }
        .card { background: #111; padding: 30px 20px; border-radius: 20px; border: 2px solid #333; min-height: 320px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; }
        .word { font-size: 2.8rem; font-weight: bold; color: #00ff88; margin-bottom: 5px; }
        .phonetic { color: #888; font-size: 1.1rem; margin-bottom: 10px; }
        .meaning { font-size: 1.5rem; color: #fff; margin-bottom: 15px; font-weight: bold; }
        .example-en { font-size: 1rem; color: #ccc; line-height: 1.3; font-style: italic; border-top: 1px solid #222; padding-top: 15px; margin-bottom: 8px; }
        .example-tr { font-size: 0.95rem; color: #00c851; font-weight: 500; }
        .buttons { display: flex; gap: 20px; margin-top: 30px; }
        button { flex: 1; height: 80px; border: none; border-radius: 15px; font-size: 2.5rem; cursor: pointer; color: white; transition: 0.1s; display: flex; align-items: center; justify-content: center; }
        .btn-no { background: #ff4444; }
        .btn-yes { background: #00c851; }
        button:active { transform: scale(0.9); }
        .counter { margin-top: 20px; color: #555; font-size: 0.9rem; font-weight: bold; }
        .hint { font-size: 0.7rem; color: #333; margin-top: 10px; }
    </style>
</head>
<body>

<div id="app">
    <div class="card" onclick="speakWord()">
        <div id="word" class="word">...</div>
        <div id="phonetic" class="phonetic"></div>
        <div id="meaning" class="meaning"></div>
        <div id="example-en" class="example-en"></div>
        <div id="example-tr" class="example-tr"></div>
    </div>
    <div class="buttons">
        <button class="btn-no" onclick="handleAction(false)">✖</button>
        <button class="btn-yes" onclick="handleAction(true)">✔</button>
    </div>
    <div id="counter" class="counter"></div>
    <div class="hint">🔊 DINLEMEK İÇİN KARTA TIKLA</div>
</div>

<script>
    // VERİ SETİ: Buraya istediğin kadar kelimeyi aynı formatta ekle.
    // w: kelime, p: okunuş, m: anlam, e: örnek cümle, et: örnek çeviri
    let words = [
        { w: "Abandon", p: "/əˈbændən/", m: "Terk etmek", e: "They had to abandon the car.", et: "Arabayı terk etmek zorunda kaldılar." },
        { w: "Ability", p: "/əˈbɪlɪti/", m: "Yetenek", e: "She has the ability to sing.", et: "Şarkı söyleme yeteneği var." },
        { w: "Accurate", p: "/ˈækjərət/", m: "Doğru, Kesin", e: "The report was accurate.", et: "Rapor doğruydu." }
    ];

    function render() {
        if (words.length === 0) {
            document.getElementById('app').innerHTML = "<h1>Hepsini ezberledin! 🔥</h1><button onclick='location.reload()' style='font-size:1rem; height:50px;'>Baştan Başla</button>";
            return;
        }
        const item = words[0];
        document.getElementById('word').innerText = item.w;
        document.getElementById('phonetic').innerText = item.p;
        document.getElementById('meaning').innerText = item.m;
        document.getElementById('example-en').innerText = item.e;
        document.getElementById('example-tr').innerText = item.et;
        document.getElementById('counter').innerText = `KALAN KELİME: ${words.length}`;
        speakWord();
    }

    function handleAction(isKnown) {
        if (isKnown) {
            // Tik (Biliyorum): Listeden temelli çıkar
            words.shift();
        } else {
            // Çarpı (Bilmiyorum): Al, listenin en arkasına koy (Sonsuz döngü)
            const current = words.shift();
            words.push(current);
        }
        render();
    }

    function speakWord() {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(words[0].w);
        msg.lang = 'en-US';
        msg.rate = 0.8;
        window.speechSynthesis.speak(msg);
    }

    // Uygulamayı Başlat
    render();
</script>
</body>
</html>
