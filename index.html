<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1-A2 İngilizce Kelime Testi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="header" style="display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;">
        <button id="btn-normal" class="mode-btn active" onclick="setMode('normal')">Normal Test</button>
        
        <div style="font-size: 1rem; font-weight: bold; color: var(--success); background: #0f172a; padding: 8px 16px; border-radius: 8px; border: 1px solid #334155;">
            ✔ Doğru: <span id="correct-count">0</span>
        </div>

        <button id="btn-wrong" class="mode-btn wrong-mode" onclick="setMode('wrong')">
            Yanlış Yapılanlar (<span id="wrong-count">0</span>)
        </button>
    </div>

    <div id="game-area">
        <div class="question-box">
            <span id="level-badge" class="badge">A1</span>
            <div id="word-display" class="word-title">Yükleniyor...</div>
        </div>

        <div class="options-grid" id="options-container">
            <!-- Seçenekler script.js tarafından buraya dinamik eklenecek -->
        </div>

        <div class="feedback-area">
            <div id="status-text" class="status-text"></div>
            <button id="next-btn" class="next-btn" onclick="nextQuestion()">Yeni Soru ➔</button>
            <button id="delete-btn" class="next-btn" style="background-color: var(--warning); margin-top: 10px; display: none;" onclick="kelimeyiEzberledim()">🧠 Ezberledim (Listeden Sil)</button>
        </div>
    </div>
</div>

<script src="words.js"></script>
<script src="script.js"></script>
</body>
</html>
