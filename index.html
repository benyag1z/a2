<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oxford 3000 - Pro</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #app { text-align: center; width: 100%; max-width: 400px; padding: 20px; }
        .card { background: #111; padding: 40px 20px; border-radius: 20px; border: 1px solid #333; min-height: 250px; cursor: pointer; }
        .word { font-size: 2.8rem; font-weight: bold; color: #fff; margin-bottom: 5px; }
        .phonetic { color: #888; font-size: 1.1rem; margin-bottom: 15px; }
        .meaning { font-size: 1.5rem; color: #00ff88; margin-bottom: 20px; font-weight: 500; }
        .example { font-size: 1rem; color: #aaa; line-height: 1.4; border-top: 1px solid #222; padding-top: 15px; }
        .buttons { display: flex; gap: 20px; margin-top: 30px; }
        button { flex: 1; height: 80px; border: none; border-radius: 15px; font-size: 2rem; cursor: pointer; color: white; transition: 0.1s; }
        .btn-no { background: #ff4444; }
        .btn-yes { background: #00c851; }
        button:active { transform: scale(0.9); }
        .counter { margin-top: 20px; color: #555; font-size: 0.9rem; }
        .speaker-icon { font-size: 1rem; color: #00c851; }
    </style>
</head>
<body>

<div id="app">
    <div class="card" onclick="speakWord()">
        <div id="word" class="word">...</div>
        <div id="phonetic" class="phonetic"></div>
        <div id="meaning" class="meaning"></div>
        <div id="example" class="example"></div>
        <div class="speaker-icon">🔊 Dinlemek için karta tıkla</div>
    </div>
    <div class="buttons">
        <button class="btn-no" onclick="nextWord(false)">✖</button>
        <button class="btn-yes" onclick="nextWord(true)">✔</button>
    </div>
    <div id="counter" class="counter"></div>
</div>

<script>
    let words = [];

    async function loadData() {
    // Oxford 3000 listesini içeren güvenilir bir açık kaynak JSON adresi
    const repoUrl = 'https://raw.githubusercontent.com/fawad-shafi/oxford-3000/master/oxford-3000.json';
    try {
        const response = await fetch(repoUrl);
        const rawData = await response.json();
        // Veriyi kendi formatımıza çeviriyoruz
        words = rawData.map(item => ({
            w: item.word,
            p: item.phonetic || '',
            m: item.definition || 'Anlamı yüklenemedi',
            e: item.example || 'Örnek cümle bulunamadı'
        }));
        render();
    } catch (e) {
        console.error("Veri çekilemedi:", e);
    }
}

    function render() {
        if (words.length === 0) {
            document.getElementById('app').innerHTML = "<h1>Hepsini ezberledin! 🚀</h1>";
            return;
        }
        const item = words[0];
        document.getElementById('word').innerText = item.w;
        document.getElementById('phonetic').innerText = item.p || '';
        document.getElementById('meaning').innerText = item.m;
        document.getElementById('example').innerText = item.e || '';
        document.getElementById('counter').innerText = `Kalan Kelime: ${words.length}`;
        
        // Yeni kelime gelince otomatik oku (opsiyonel)
        speakWord();
    }

    function speakWord() {
        const msg = new SpeechSynthesisUtterance();
        msg.text = words[0].w;
        msg.lang = 'en-US'; // İngilizce telaffuz
        window.speechSynthesis.speak(msg);
    }

    function nextWord(isKnown) {
        if (isKnown) {
            words.shift(); // Tik: Listeden at
        } else {
            const current = words.shift(); // Çarpı: Sona ekle
            words.push(current);
        }
        render();
    }

    loadData();
</script>
</body>
</html>
