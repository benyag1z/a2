<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oxford 3000 Pro</title>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #app { text-align: center; width: 100%; max-width: 400px; padding: 20px; }
        .card { background: #111; padding: 40px 20px; border-radius: 20px; border: 2px solid #333; min-height: 250px; cursor: pointer; position: relative; }
        .word { font-size: 2.8rem; font-weight: bold; color: #00ff88; margin-bottom: 5px; }
        .phonetic { color: #888; font-size: 1.1rem; margin-bottom: 15px; }
        .meaning { font-size: 1.5rem; color: #fff; margin-bottom: 20px; }
        .example { font-size: 1rem; color: #aaa; line-height: 1.4; border-top: 1px solid #222; padding-top: 15px; }
        .buttons { display: flex; gap: 20px; margin-top: 30px; }
        button { flex: 1; height: 80px; border: none; border-radius: 15px; font-size: 2rem; cursor: pointer; color: white; }
        .btn-no { background: #ff4444; }
        .btn-yes { background: #00c851; }
        .counter { margin-top: 20px; color: #555; font-size: 0.9rem; }
    </style>
</head>
<body>

<div id="app">
    <div class="card" onclick="speakWord()">
        <div id="word" class="word">Yükleniyor...</div>
        <div id="phonetic" class="phonetic"></div>
        <div id="meaning" class="meaning"></div>
        <div id="example" class="example"></div>
        <div style="font-size: 0.7rem; color: #444; margin-top: 10px;">🔊 DINLEMEK İÇIN TIKLA</div>
    </div>
    <div class="buttons">
        <button class="btn-no" onclick="handleAction(false)">✖</button>
        <button class="btn-yes" onclick="handleAction(true)">✔</button>
    </div>
    <div id="counter" class="counter"></div>
</div>

<script>
    // BURAYA KELIMELERI EKLIYORUZ (Örnek başlangıç seti)
    // 3000 kelimenin tamamını bu listenin içine virgülle ayırarak ekleyebilirsin
    let words = [
        { w: "Abandon", p: "/əˈbændən/", m: "Terk etmek", e: "They had to abandon the car." },
        { w: "Ability", p: "/əˈbɪlɪti/", m: "Yetenek", e: "She has a great ability to learn." },
        { w: "Abolish", p: "/əˈbɒlɪʃ/", m: "Kaldırmak (Yasa vb.)", e: "The tax was abolished last year." },
        { w: "Abstract", p: "/ˈæbstrækt/", m: "Soyut", e: "Truth and honor are abstract concepts." },
        { w: "Academic", p: "/ˌækəˈdemɪk/", m: "Akademik", e: "He had a brilliant academic career." },
        { w: "Accompany", p: "/əˈkʌmpəni/", m: "Eşlik etmek", e: "I will accompany you to the door." }
        // İstediğin kadar kelimeyi bu formatta aşağıya eklemeye devam edebilirsin
    ];

    function render() {
        if (words.length === 0) {
            document.getElementById('app').innerHTML = "<h1>Hepsini bitirdin! 🎉</h1>";
            return;
        }
        const item = words[0];
        document.getElementById('word').innerText = item.w;
        document.getElementById('phonetic').innerText = item.p;
        document.getElementById('meaning').innerText = item.m;
        document.getElementById('example').innerText = item.e;
        document.getElementById('counter').innerText = `KALAN: ${words.length}`;
        speakWord();
    }

    function handleAction(isKnown) {
        if (isKnown) {
            words.shift(); // Tik: Sil
        } else {
            const current = words.shift(); // Çarpı: Sona at
            words.push(current);
        }
        render();
    }

    function speakWord() {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(words[0].w);
        msg.lang = 'en-US';
        window.speechSynthesis.speak(msg);
    }

    // Uygulamayı başlat
    render();
</script>
</body>
</html>
