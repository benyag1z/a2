<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1-A2 İngilizce Kelime Testi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="header">
        <button id="btn-normal" class="mode-btn active" onclick="setMode('normal')">Normal Test</button>
        <button id="btn-wrong" class="mode-btn wrong-mode" onclick="setMode('wrong')">
            Yanlış Yapılanlar (<span id="wrong-count">0</span>)
        </button>
    </div>

    <div id="game-area">
        <div class="question-box">
            <span id="level-badge" class="badge">A1</span>
            <div id="word-display" class="word-title">Yükleniyor...</div>
        </div>

        <div class="options-grid" id="options-container">
            </div>

        <div class="feedback-area">
            <div id="status-text" class="status-text"></div>
            <button id="next-btn" class="next-btn" onclick="nextQuestion()">Yeni Soru ➔</button>
        </div>
    </div>
</div>

<script src="words.js"></script>
<script src="script.js"></script>
</body>
</html>
